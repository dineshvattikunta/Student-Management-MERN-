version: '3.8'

services:
  # Official MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: campusos_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: campusos
    volumes:
      - mongo_data:/data/db
    networks:
      - campusos_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express + Node.js Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusos_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/campusos
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - campusos_net

  # React + Vite Frontend Service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusos_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - campusos_net

volumes:
  mongo_data:
    driver: local

networks:
  campusos_net:
    driver: bridge
